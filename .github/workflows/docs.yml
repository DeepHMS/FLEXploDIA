# Builds the tutorial site in flexplodia_docs/ and publishes it to GitHub Pages
# whenever something in that folder changes on main.
name: docs
on:
  push:
    branches: [main]
    paths: ["flexplodia_docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r flexplodia_docs/requirements-docs.txt
      - run: mkdocs gh-deploy --force --config-file flexplodia_docs/mkdocs.yml
